name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for npm provenance and Trusted Publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      # No registry-url: it writes an .npmrc with _authToken=${NODE_AUTH_TOKEN},
      # and that placeholder token is what pnpm authenticates with instead of
      # exchanging the OIDC id-token for a publish token.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1, and the runner ships 10.9.8.
      # setup-node has no input for the npm version, so install it explicitly.
      # pnpm still does install/test; only the publish goes through npm.
      - name: Pin a trusted-publishing-capable npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      # A release can be cut from any commit, so re-verify rather than
      # trusting that CI passed on whatever this tag points at.
      - run: pnpm run typecheck

      - run: pnpm test

      - name: Check tag matches package version
        run: |
          tag="${{ github.event.release.tag_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # Published with npm rather than pnpm: pnpm 10 delegates publish to the
      # npm CLI anyway, and only npm >= 11.5.1 performs the OIDC exchange.
      # prepublishOnly runs clean + build, so dist is always fresh.
      - name: Publish
        run: npm publish --access public --provenance
